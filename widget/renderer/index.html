<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<title>PartTrail 精靈</title>
<link rel="stylesheet" href="widget.css" />
</head>
<body>
  <div id="stage">
    <section id="panel" class="hit" hidden>
      <header>
        <strong id="panel-title">即將到貨</strong>
        <div class="panel-actions">
          <button id="btn-refresh" title="立即更新">⟳</button>
          <button id="btn-dashboard" title="開啟追蹤總表">⧉</button>
          <button id="btn-close" title="收合">✕</button>
        </div>
      </header>
      <ul id="list"></ul>
      <footer id="updated"></footer>
    </section>

    <div id="bubble" class="hit" hidden></div>

    <div id="sprite" class="hit" title="點我看清單，拖曳可移動">
      <svg viewBox="0 0 120 120" width="112" height="112" aria-hidden="true">
        <defs>
          <radialGradient id="body-g" cx="40%" cy="35%" r="70%">
            <stop offset="0" stop-color="#f0a283" />
            <stop offset="1" stop-color="#d97757" />
          </radialGradient>
        </defs>
        <ellipse class="shadow" cx="60" cy="112" rx="30" ry="5" />
        <g class="bob">
          <!-- 頭上的星芒 -->
          <g class="spark" transform="translate(60 22)">
            <path d="M0-12 2.4-2.4 12 0 2.4 2.4 0 12-2.4 2.4-12 0-2.4-2.4z" fill="#f6c45b" />
          </g>
          <!-- 身體 -->
          <path class="body" d="M60 30c26 0 40 18 40 42 0 22-16 34-40 34S20 94 20 72c0-24 14-42 40-42z" fill="url(#body-g)" />
          <!-- 小手 -->
          <ellipse class="arm left" cx="22" cy="78" rx="7" ry="10" fill="#d97757" />
          <ellipse class="arm right" cx="98" cy="78" rx="7" ry="10" fill="#d97757" />
          <!-- 臉 -->
          <g class="eyes">
            <g class="eyes-open">
              <ellipse cx="46" cy="68" rx="5" ry="7" fill="#2b2a27" />
              <ellipse cx="74" cy="68" rx="5" ry="7" fill="#2b2a27" />
              <circle cx="48" cy="65" r="1.8" fill="#fff" />
              <circle cx="76" cy="65" r="1.8" fill="#fff" />
            </g>
            <g class="eyes-happy" fill="none" stroke="#2b2a27" stroke-width="3" stroke-linecap="round">
              <path d="M40 70q6-8 12 0M68 70q6-8 12 0" />
            </g>
          </g>
          <ellipse cx="38" cy="80" rx="6" ry="3.5" fill="#f7b6a0" opacity=".8" />
          <ellipse cx="82" cy="80" rx="6" ry="3.5" fill="#f7b6a0" opacity=".8" />
          <path class="mouth smile" d="M54 82q6 6 12 0" fill="none" stroke="#2b2a27" stroke-width="2.5" stroke-linecap="round" />
          <ellipse class="mouth oh" cx="60" cy="85" rx="4" ry="5" fill="#2b2a27" />
          <!-- 汗滴（逾期時） -->
          <path class="sweat" d="M90 46q5 8 0 11-5-3 0-11z" fill="#8fd3ff" />
          <!-- 包裹 -->
          <g class="box" transform="translate(46 92)">
            <rect width="28" height="18" rx="3" fill="#c99a66" />
            <path d="M0 6h28M14 0v18" stroke="#a87a48" stroke-width="2" />
          </g>
        </g>
        <!-- 數字徽章 -->
        <g class="badge">
          <circle cx="100" cy="28" r="13" />
          <text x="100" y="33" text-anchor="middle" id="badge-num">0</text>
        </g>
      </svg>
    </div>
  </div>
<script src="widget.js"></script>
</body>
</html>
