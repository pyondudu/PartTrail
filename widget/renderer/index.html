<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<title>PartTrail 精靈</title>
<link rel="stylesheet" href="widget.css" />
</head>
<body>
  <div id="stage">
    <section id="panel" class="hit" hidden>
      <header>
        <strong id="panel-title">即將到貨</strong>
        <div class="panel-actions">
          <button id="btn-refresh" title="立即更新">⟳</button>
          <button id="btn-dashboard" title="開啟追蹤總表">⧉</button>
          <button id="btn-close" title="收合">✕</button>
        </div>
      </header>
      <ul id="list"></ul>
      <footer id="updated"></footer>
    </section>

    <!-- 小精靈與對話泡泡一起左右走動，泡泡尾巴才會一直對準精靈 -->
    <div id="buddy">
      <div id="bubble" class="hit" hidden></div>

      <div id="sprite" class="hit" title="點我看清單，拖曳可移動">
        <!-- 16×16 像素畫，放大 7 倍 -->
        <svg viewBox="0 0 16 16" width="112" height="112" shape-rendering="crispEdges" aria-hidden="true">
          <ellipse class="shadow" cx="8" cy="15.3" rx="4.6" ry="0.6" shape-rendering="auto" />
          <g class="bob">
            <!-- 頭上的星星 -->
            <g class="spark" fill="#f6c45b">
              <rect x="7" y="0" width="2" height="3" />
              <rect x="6" y="1" width="4" height="1" />
            </g>
            <!-- 身體、小手 -->
            <g fill="#d97757">
              <rect class="body" x="3" y="4" width="10" height="7" />
              <rect class="arm left" x="1" y="6" width="2" height="2" />
              <rect class="arm right" x="13" y="6" width="2" height="2" />
            </g>
            <!-- 腳：停下時站好；走路時 a、b 兩組交替＝踏步（同一時間只顯示一組） -->
            <g fill="#d97757">
              <g class="legs legs-stand">
                <rect x="4" y="11" width="1" height="2" /><rect x="6" y="11" width="1" height="2" />
                <rect x="9" y="11" width="1" height="2" /><rect x="11" y="11" width="1" height="2" />
              </g>
              <g class="legs legs-a">
                <rect x="4" y="11" width="1" height="2" /><rect x="6" y="11" width="1" height="1" />
                <rect x="9" y="11" width="1" height="2" /><rect x="11" y="11" width="1" height="1" />
              </g>
              <g class="legs legs-b">
                <rect x="4" y="11" width="1" height="1" /><rect x="6" y="11" width="1" height="2" />
                <rect x="9" y="11" width="1" height="1" /><rect x="11" y="11" width="1" height="2" />
              </g>
            </g>
            <!-- 臉：走路時眼睛看前進方向 -->
            <g class="look">
              <g class="eyes-open" fill="#2b2a27">
                <rect x="5" y="6" width="1" height="2" />
                <rect x="10" y="6" width="1" height="2" />
              </g>
              <g class="cheeks" fill="#f7b6a0">
                <rect x="4" y="8" width="1" height="1" />
                <rect x="11" y="8" width="1" height="1" />
              </g>
              <rect class="mouth oh" x="7" y="8" width="2" height="2" fill="#2b2a27" />
            </g>
            <!-- 汗滴（逾期時） -->
            <g class="sweat" fill="#8fd3ff">
              <rect x="1" y="3" width="1" height="2" /><rect x="2" y="4" width="1" height="1" />
            </g>
            <!-- 包裹（有到貨時抱著） -->
            <g class="box">
              <rect x="5" y="9" width="6" height="4" fill="#c99a66" />
              <rect x="7" y="9" width="2" height="4" fill="#a87a48" />
            </g>
          </g>
          <!-- 數字徽章 -->
          <g class="badge" shape-rendering="auto">
            <circle cx="14" cy="2" r="2.3" />
            <text x="14" y="2.95" text-anchor="middle" id="badge-num">0</text>
          </g>
        </svg>
      </div>
    </div>
  </div>
<script src="widget.js"></script>
</body>
</html>
